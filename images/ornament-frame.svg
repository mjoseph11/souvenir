<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 955" preserveAspectRatio="none">
  <!-- Corner sprays for Golden Jubilee member pages, drawn to match the
       density of Manoj's own mock-up (WhatsApp, 16 Sept): larger sprays that
       run right to the page edges, in two leaf tones with small berries.
       Spans the whole page width between header and footer; units are
       hundredths of an inch. Replaces the lighter ornament-corner.svg. -->
  <defs>
    <g id="spray">
      <!-- stems -->
      <path d="M-14 -6C70 26 140 74 196 140" fill="none" stroke="#BEA75E" stroke-width="2.1" stroke-linecap="round" opacity=".42"/>
      <path d="M26 6C62 46 74 96 68 148" fill="none" stroke="#9C8A4E" stroke-width="1.5" stroke-linecap="round" opacity=".3"/>
      <path d="M70 34C118 50 158 44 196 22" fill="none" stroke="#9C8A4E" stroke-width="1.5" stroke-linecap="round" opacity=".3"/>
      <path d="M8 60C34 104 38 150 28 196" fill="none" stroke="#9C8A4E" stroke-width="1.3" stroke-linecap="round" opacity=".24"/>

      <!-- large leaves -->
      <g fill="#C9A227" opacity=".26">
        <ellipse cx="34" cy="2" rx="28" ry="10" transform="rotate(-14 34 2)"/>
        <ellipse cx="80" cy="26" rx="30" ry="11" transform="rotate(-6 80 26)"/>
        <ellipse cx="132" cy="58" rx="29" ry="10.5" transform="rotate(10 132 58)"/>
        <ellipse cx="176" cy="102" rx="26" ry="9.5" transform="rotate(24 176 102)"/>
        <ellipse cx="18" cy="40" rx="24" ry="9" transform="rotate(62 18 40)"/>
        <ellipse cx="52" cy="92" rx="26" ry="9.5" transform="rotate(72 52 92)"/>
        <ellipse cx="66" cy="146" rx="24" ry="9" transform="rotate(84 66 146)"/>
        <ellipse cx="196" cy="150" rx="22" ry="8.5" transform="rotate(38 196 150)"/>
        <ellipse cx="206" cy="30" rx="24" ry="9" transform="rotate(-30 206 30)"/>
      </g>

      <!-- smaller, cooler leaves layered under them -->
      <g fill="#8C7A34" opacity=".2">
        <ellipse cx="58" cy="0" rx="18" ry="6.5" transform="rotate(-36 58 0)"/>
        <ellipse cx="108" cy="20" rx="19" ry="7" transform="rotate(-22 108 20)"/>
        <ellipse cx="156" cy="34" rx="17" ry="6.2" transform="rotate(-12 156 34)"/>
        <ellipse cx="4" cy="86" rx="18" ry="6.5" transform="rotate(78 4 86)"/>
        <ellipse cx="30" cy="140" rx="17" ry="6.2" transform="rotate(86 30 140)"/>
        <ellipse cx="24" cy="190" rx="15" ry="5.6" transform="rotate(92 24 190)"/>
        <ellipse cx="150" cy="108" rx="16" ry="6" transform="rotate(30 150 108)"/>
        <ellipse cx="102" cy="74" rx="16" ry="6" transform="rotate(46 102 74)"/>
      </g>

      <!-- berries -->
      <g fill="#C9A227" opacity=".34">
        <circle cx="120" cy="40" r="3.4"/>
        <circle cx="44" cy="62" r="3"/>
        <circle cx="168" cy="72" r="2.8"/>
        <circle cx="86" cy="118" r="2.8"/>
        <circle cx="14" cy="120" r="2.4"/>
      </g>
    </g>
  </defs>

  <use href="#spray" x="0" y="0"/>
  <use href="#spray" transform="translate(850,0) scale(-1,1)"/>
  <use href="#spray" transform="translate(0,955) scale(1,-1)"/>
  <use href="#spray" transform="translate(850,955) scale(-1,-1)"/>
</svg>
