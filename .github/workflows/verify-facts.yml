name: Verify content

# Guards against silent regression of verified facts (e.g. ministry leadership
# confirmed via issues). Fails the build if index.html drops or reverts any
# entry in data/verified-facts.json.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-facts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check verified facts
        run: node scripts/check-verified.js
      # Rebuild from src/ + data/ and run the headless-Chrome layout check: overflow,
      # text under the footer, squeezed photos, and the iPhone-proof fixes of 16 Nov
      # (no soft shadows, even spacing and no stranded lines on article pages).
      - name: Rebuild and check layout
        run: |
          node scripts/build.js
          node scripts/check-layout.js
