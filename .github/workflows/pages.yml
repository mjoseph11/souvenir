name: Publish site

# Publishes only the files the book pages use (scripts/pack-site.js), about
# half the repo, instead of the whole repo. Pages deploys of the full ~385 MB
# often failed on GitHub's side ("Deployment failed, try again later"), so a
# failed deploy is retried once.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://mjoseph11.github.io/souvenir/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Pack the site
        run: node scripts/pack-site.js _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Deploy (retry)
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
